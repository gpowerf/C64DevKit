# =============================================================================
# Sprite Dodge — Complete Game Specification
# =============================================================================
#
# The player controls a ship avoiding an enemy octopus and asteroids.
# Score accumulates while the ship stays in the green zone (left side).
# The DMZ (right side, cols 28–39) provides collision immunity at a cost.
# Level thresholds are binary: 256, 512, 1024, then every 512.
# Enemy speed and asteroid count rise per level (capped at 5).
#
# Architecture note:
#   The behaviour DSL handles the HUD display (display_text / display_number
#   actions).  All other game systems — input, AI, collision, state machine,
#   scoring, spawning, sound, visual effects — are implemented in the custom
#   assembly routine `routines/game_logic.acme`.  This file documents every
#   system so the game can be recreated from scratch.
#
# Call order each frame (generated main loop):
#   1. behaviours_update  (generated from actions in this file)
#   2. jsr game_logic     (user routine — game_logic.acme)
#
# =============================================================================
# Runtime Variables (declared at top of game_logic.acme, all absolute-addressed)
# =============================================================================
#
#   Name         Size   Init     Description
#   ──────────── ────── ──────── ───────────────────────────────────────────
#   score        2 B    0       16-bit score (little-endian, lo then hi)
#   lives        1 B    3       Remaining lives (capped at 9 by the
#                                level-5 survival reward)
#   enemy_x      1 B    100     Enemy logical X (software, not VIC register)
#   enemy_y      1 B    80      Enemy logical Y
#   enemy_init   1 B    0       Set to 1 after first-frame enemy position init
#   hit_timer    1 B    0       Collision cooldown (decremented each frame)
#   snd_timer    1 B    0       Sound duration countdown
#   state        1 B    3       State machine: 0=playing 1=dying 2=gameover 3=splash
#   state_tmr    1 B    0       Dying-state timer (150 frames ≈ 3 sec)
#   score_tmr    1 B    0       Countdown to next score tick (20 frames)
#   zone_ticks   1 B    0       Consecutive green-zone scoring frames
#   flash_tmr    1 B    0       Death flash toggle timer (4-frame cycle)
#   init_done    1 B    0       One-time init guard
#   splash_done  1 B    0       Splash screen rendered flag
#   go_drawn     1 B    0       Game-over screen drawn flag
#   speed_ctr    1 B    0       Fractional-speed accumulator
#   last_safe    1 B    0       Was player in DMZ last frame? (0=no, 1=yes)
#   player_dir   1 B    0       Direction: 0=right 1=left 2=up 3=down
#   dmz_seed     1 B    $5A     Galois LFSR state for DMZ noise + asteroid shuffle
#   dmz_timer    1 B    1       DMZ refresh countdown (refreshes at 0, resets to 3)
#   dmz_col      1 B    0       DMZ column index (unused, historical)
#   dmz_row      1 B    1       DMZ row index (unused, historical)
#   level        1 B    1       Level counter (increments forever; difficulty
#                               tables cap at 5)
#   speed_frac   1 B    128     Enemy fractional speed (128 = 25 px/s at 50 fps)
#   ast_timer    1 B    40      Countdown to next asteroid spawn
#   ast_active   1 B    0       Bitmask: bit0=ast0, bit1=ast1, bit2=ast2
#   ast_msb      1 B    0       $D010 MSB bits for asteroid X ≥ 256
#   ast_x[3]     3 B    —       Asteroid X positions
#   ast_y[3]     3 B    —       Asteroid Y positions
#   ast_dx[3]    3 B    —       Asteroid X velocity (signed)
#   ast_dy[3]    3 B    —       Asteroid Y velocity (signed)
#   ast_vx       1 B    —       Temp: spawn X velocity
#   ast_vy       1 B    —       Temp: spawn Y velocity
#   ast_warn_dir 1 B    255     Pre-rolled spawn direction: 0=bot 1=top 2=right 3=left
#                           (255 = none; set to 255 again when the pre-roll
#                           is consumed by a spawn)
#   ast_next_vx  1 B    —       Pre-rolled spawn X velocity
#   ast_next_vy  1 B    —       Pre-rolled spawn Y velocity
#   ast_warn_x   1 B    —       Pre-rolled spawn X position
#   ast_warn_y   1 B    —       Pre-rolled spawn Y position
#   ast_pdly     1 B    0       Marker linger countdown (frames): >0 means the
#                           radar still shows the consumed marker cell while
#                           the rock crosses it; ast_update decrements it every
#                           frame and re-pre-rolls the next warning at 0
#   start_level  1 B    0       Level chosen on the splash (loader/M path);
#                           consumed by do_init (0/1 = level 1, 2-5 = picked)
#   c_saved      1 B    0       Saved $D01E value for multi-check in same frame
#   radar_was    1 B    0       Radar visibility edge detect
#   pulse_ctr    1 B    0       Enemy colour pulse timer (level 5+)
#   trans_ready  1 B    0       Flag: level-up detected, trigger transition
#   trans_tmr    1 B    0       Transition countdown timer (90 frames)
#   trans_level  1 B    0       Level number to display during transition
#   trans_done   1 B    0       Text drawn flag (one-shot)
#   ship_ctr     1 B    0       Ship animation counter (every 2 frames)
#   ship_frame   1 B    0       Ship animation frame (0=no trail, 1=trail)
#   player_moving 1 B   0       Set by keyboard_read: 1 if sprite 0 moved
#   prev_x/prev_y 1 B ea 0      Sprite 0 position last frame (delta detect)
#   enemy_ctr    1 B    0       Enemy animation counter (every 6 frames)
#   enemy_frame  1 B    0       Enemy animation frame (0–7)
#   boom_tmr     1 B    0       Death-boom countdown (0=inactive)
#   pwr_avail    1 B    0       Invincibility charge available (0/1)
#   pwr_flash    1 B    0       Flash cycle counter during invincibility
#   pwr_key      1 B    0       Fire/shift edge state (0=held, 1=released)
#
#   Framework-provided (accessible from routines):
#     frame_ready    1 B    —   Set to 1 after raster IRQ, cleared after use
#     joystick_state 1 B    —   Joystick state, active high (unused; WASD+joy inline)
#     joystick_prev  1 B    —   Previous frame state (unused)
#     random         1 B    —   Independent Galois LFSR, advanced each frame
#


# =============================================================================
# HUD Display — rendered every frame by behaviour DSL
# =============================================================================
#
# Row 0 header, white on black:
#   "score: XXXXX  lives: X lv: X"
#
# score    — 5-digit decimal from 16-bit variable
# lives    — 1-digit decimal
# level    — 1-digit decimal
#
# The behaviour DSL writes PETSCII text and colour RAM at the specified
# row/col positions.  The zone colours on row 0 are overwritten with
# white (colour 1) during one-time init.
#
behaviors:
  - name: hud
    type: on_frame
    actions:
      - display_text: {text: "score:", row: 0, col: 0, color: 1}
      - display_number: {variable: score, row: 0, col: 6, digits: 5, color: 1}
      - display_text: {text: "  lives:", row: 0, col: 11, color: 1}
      - display_number: {variable: lives, row: 0, col: 19, digits: 1, color: 1, size: 1}
      - display_text: {text: "lv:", row: 0, col: 22, color: 1}
      - display_number: {variable: level, row: 0, col: 25, digits: 2, color: 1, size: 1}


# =============================================================================
#   END OF BEHAVIOUR DSL
# ─────────────────────────────────────────────────────────────────────────────
#   All systems below are implemented in routines/game_logic.acme.
#   Documented here as the canonical game design reference.
# =============================================================================


# =============================================================================
# System 1 — State Machine
# =============================================================================
#
# States (defined as constants in assembly):
#   GAME_SPLASH  = 3   Title screen, DMZ side-bar shimmer, SPACE to start
#   GAME_PLAYING = 0   Normal gameplay
#   GAME_DYING   = 1   Player just hit; flash + timer before respawn
#   GAME_OVER    = 2   Lives exhausted; "game over" + SPACE to restart
#   GAME_TRANSITION = 4  Between levels: "LEVEL X" display (1–2 digits,
#                         leading space below 10), reset, timer
#
# Transitions:
#   SPLASH → PLAYING     SPACE pressed (re-runs do_init, enables sprites)
#   PLAYING → DYING       Player/enemy collision OR asteroid collision
#                            (requires: hit_timer==0, player not in DMZ,
#                             distance gate < 18 px)
#   PLAYING → TRANSITION   Score crosses the binary threshold (level-up)
#                            (also triggered by SPACE cheat key)
#   TRANSITION → PLAYING    90-frame countdown expires; positions reset,
#                            score_tmr/zone_ticks/last_safe zeroed for new level
#   DYING → PLAYING         150-frame timer expires + lives > 0
#                            (player sprite flashes at 4-frame interval)
#   DYING → GAME_OVER     150-frame timer expires + lives == 0
#   GAME_OVER → PLAYING   SPACE pressed (calls restart subroutine)
#
# Frame dispatch logic:
#   1. Always run sfx_gate_off + sfx_tick_all + dmz_do
#   2. If SPLASH: jump to do_splash, own frame loop (bypasses everything)
#   3. If TRANSITION: jump to do_transition (draw text, countdown)
#   4. Else: keyboard + player animation + powerup HUD indicator +
#            level_update + ast_update + radar_do
#   5. If PLAYING: do_play (pwr_check, enemy_do, score_do, collision_do,
#            ast_collision, invincibility flash)
#   6. If DYING:   do_die (flash, timer, respawn or game over)
#   7. If GAME_OVER: do_over (draw text, wait for SPACE, restart)
#


# =============================================================================
# System 2 — One-Time Init (do_init)
# =============================================================================
#
# Runs exactly once at startup (guarded by init_done flag).
# Does NOT run on restart (only init_done reset by splash→play transition).
#
# Steps:
#   1. Seed LFSR:  dmz_seed = $D012 XOR $5A  (raster-line + constant)
#   2. Set border to dark grey (11)
#   3. Fill screen RAM with $A0 (solid block glyph) — this makes the
#      colour-RAM zones visible as solid vertical bars
#   4. Paint colour RAM with 3-zone layout (rows 1–24):
#        cols 0–12:  green (5)
#        cols 13–27: black (0)
#        cols 28–39: blue  (6) — base colour under DMZ static
#   5. Paint row 0 colour RAM white (1) for HUD header
#   6. Init enemy VIC position from enemy_x / enemy_y
#      Clear $D010 bit 1 (enemy MSB)
#   7. Call dmz_init — fill entire DMZ (288 cells) with LFSR noise once
#   8. Init asteroid sprites:
#        Set pointers $07FA/$07FB/$07FC = $90  (all point to rock.spr at $2400)
#        Set colours: sprite 2=yellow(7), 3=orange(8), 4=light-red(10)
#        Place off-screen: X=0, Y=250
#   9. Init radar sprite:
#        Set pointer $07FD = $91  (crosshair data at $2440)
#        Set colour: yellow(7)
#        Place off-screen: X=0, Y=250
#
# DMZ initial fill (dmz_init):
#   For each of 288 cells (cols 28–39, rows 1–24):
#     Advance LFSR, mask to 0–7, pick from palette:
#       dmz_colors = [6(blue), 14(lt.blue), 3(cyan), 4(purple),
#                     8(orange), 10(lt.red), 15(lt.grey), 1(white)]
#     Write to colour RAM.
#   Uses conditional LFSR (Galois: shift right, XOR $2D if carry out,
#   guarantee non-zero by setting to $5A if result is zero).
#


# =============================================================================
# System 3 — Player Movement (keyboard_read)
# =============================================================================
#
# Input sources (both active simultaneously):
#   Keyboard:  WASD via CIA1 column-scan  ($DC00/$DC01)
#   Joystick:  Port 2 via CIA1 PRA read   ($DC00, active low)
#
# Keyboard matrix reads:
#   W (up):    write $FD → read $DC01, check bit 1 ($02)  — column 1, row 1
#   S (down):  write $FD → read $DC01, check bit 4 ($10)  — column 1, row 4
#   A (left):  write $FD → read $DC01, check bit 2 ($04)  — column 1, row 2
#   D (right): write $FB → read $DC01, check bit 2 ($04)  — column 2, row 2
#
# Joystick port 2:
#   Write $00 → $DC02 (port A = all inputs)
#   Read $DC00, eor #$FF (invert to active high)
#   Restore $FF → $DC02 (port A = all outputs, keyboard mode)
#   Bits: 0=UP, 1=DOWN, 2=LEFT, 3=RIGHT
#
# Movement (applied identically for keyboard and joystick):
#   UP:    If Y > 50: DEC $D001.  Set player_dir = 2.
#   DOWN:  If Y < 229: INC $D001.  Set player_dir = 3.
#   LEFT:  If X > 24 (or MSB set): decrement X with full $D010 handling.
#          Set player_dir = 1.
#          If X=0 and MSB set: clear MSB, then decrement.
#   RIGHT: If X < DMZ edge (X < 64 requires special handling):
#          Set player_dir = 0.
#          If X=255: increment + set MSB.
#          Else: increment X.
#
# Player directional animation (2-frame cycle):
#   Every frame: sprite pointer $07F8 = $D0 + player_dir + ship_frame * 5
#   This selects one of eight 64-byte sprite data blocks:
#     $D0 → $3400 (right, frame 0), $D1 → $3440 (left,  frame 0),
#     $D2 → $3480 (up,    frame 0), $D3 → $34C0 (down,  frame 0),
#     $D5 → $3540 (right, frame 1), $D6 → $3580 (left,  frame 1),
#     $D7 → $35C0 (up,    frame 1), $D8 → $3600 (down,  frame 1)
#   ($D4 is the enemy octopus frame 1, hence the *5 skip over it.)
#   Frame 0 art is the no-trail pose; frame 1 carries the exhaust
#   trail.
#   Movement gate (anim_update):
#     Moving (state == PLAYING and player_moving == 1, set by
#     keyboard_read when the sprite position changed this frame):
#     alternate every 2 frames (25 Hz flicker — the two trail
#     positions blend on the phosphor, reading as translucent
#     exhaust).
#     Stationary (player_moving == 0) or outside PLAYING: freeze on
#     frame 0 — the trail is completely hidden.
#   l1/d1 are hand-drawn variants, not mechanical mirrors of r1/u1.
#
# X-position constraint detail:
#   The DMZ boundary is at X=224 (low byte, MSB=0).
#   Normal play: X <= 343 (224+119 via MSB handoff… actually bounded
#   at 319 w/ MSB set, but the right-edge check only runs when X<64
#   with MSB clear, effectively keeping the player left of the DMZ).
#
# No `joystick_state` is populated — the routine directly modifies VIC registers.
#


# =============================================================================
# System 4 — Scoring (score_do)
# =============================================================================
#
# Three zones, defined by player X position and $D010 MSB:
#   ┌─────────┬───┬───────────────────────────────────────────────────┐
#   │ Zone    │ X │ Behaviour                                         │
#   ├─────────┼───┼───────────────────────────────────────────────────┤
#   │ DMZ     │ ≥224 (MSB=0) or MSB=1 │ −5 on entry, no score, reset │
#   │ Neutral │ 128–223   │ No score, reset zone_ticks               │
#   │ Score   │ 24–127    │ Tiered score every 20 frames              │
#   └─────────┴───────────┴──────────────────────────────────────────┘
#
# DMZ entry penalty:
#   If MSB set OR X >= 224 (low byte): player is in DMZ.
#   On first frame entering DMZ (last_safe==0): −5 points.
#   Reset zone_ticks to 0.
#   Set last_safe = 1.
#
# Neutral zone (128 ≤ X < 224, MSB clear):
#   Reset zone_ticks to 0.
#   No score.
#
# Score zone (X < 128, MSB clear):
#   Every 20 frames (score_tmr counts 0..20):
#     Increment zone_ticks.
#     zone_ticks < 13:  +2 points
#     zone_ticks < 38:  +3 points
#     zone_ticks ≥ 38:  +5 points
#   (At 50 fps, 20 frames = 2.5 ticks/sec.
#    Tier thresholds: 0–5s → +5/s, 5–15s → +7.5/s, 15s+ → +12.5/s)
#
# Leaving green or neutral zones → leaving DMZ:
#   last_safe reset to 0 so next DMZ entry triggers penalty again.
#
# Score wraps on overflow (16-bit, 0–65535).
#


# =============================================================================
# System 5 — Enemy AI (enemy_do)
# =============================================================================
#
# The enemy octopus chases the player at level-dependent speed.
#
# Logic:
#   1. First frame (enemy_init==0): copy enemy_x / enemy_y to VIC registers,
#      set enemy_init=1, return.
#
#   2. Fractional speed accumulator:
#        speed_ctr += speed_frac   (8-bit add with carry)
#        If no carry: return (skip movement this frame).
#        Effective speed = speed_frac/256 * 50 px/s.
#          128/256 * 50 = 25 px/s  (level 1–3)
#          154/256 * 50 ≈ 30 px/s  (level 4)
#          179/256 * 50 ≈ 35 px/s  (level 5)
#
#   3. Movement (when carry set):
#        Compare player VIC X vs enemy_x:
#          Player X > enemy_x → inc enemy_x (move right)
#          Player X < enemy_x → dec enemy_x (move left)
#          Equal → skip X movement
#
#        Compare player VIC Y vs enemy_y:
#          Player Y > enemy_y → inc enemy_y (move down)
#          Player Y < enemy_y → dec enemy_y (move up)
#          Equal → skip Y movement
#
#   4. Clamp enemy position:
#        X clamped to [24, 224]
#        Y clamped to [58, 229]
#      At level 5+: enemy colour pulsates red (2) ↔ light red (10)
#      every 8 frames via pulse_ctr.
#
#   5. Write enemy_x / enemy_y to VIC registers ($D002/$D003).
#      Clear $D010 bit 1 (enemy never uses MSB — max X=224).
#
#   Enemy uses software variables for sub-pixel precision (the speed
#   accumulator skips frames), then writes to VIC registers every
#   movement frame.
#
# Enemy animation — octopus, hand-drawn cycle (7 frames, advances
# every 6 frames via anim_update / enemy_ctr — 42-frame loop at 50 Hz):
#   Every frame: sprite pointer $07F9 = $D4 + enemy_frame (+4 skip
#   when enemy_frame > 0, jumping over the four ship frame-1 blocks):
#     $D4 → $3500 (skull,  frame 0 — rest pose),
#     $D9 → $3640 (skull1, frame 1) … $DF → $37C0 (skull7, frame 7)
#   Frame 0 is the hand-drawn rest pose.  Frames 1-7 are a traveling
#   wave: each tentacle's pixel runs displace horizontally with the
#   wave's amplitude ramping from the web anchor to the tip and its
#   phase advancing down the arm, so the wave visibly travels down
#   the tentacles; diagonal gaps between rows are bridged so the arms
#   never tear, and the side sweeps paddle in anti-phase.  Mantle,
#   eyes and web stay fixed.  Frame 8 wraps to the rest pose
#   seamlessly.  (Sprite files keep the historical skull* prefix.)
#


# =============================================================================
# System 6 — Collision (collision_do + ast_collision)
# =============================================================================
#
# Player-enemy collision (collision_do):
#
#   Pre-checks:
#     - hit_timer > 0 → decrement, return (cooldown active)
#     - Player in DMZ (X ≥ 224 or MSB set) → no collision (immune)
#
#   Hardware check:
#     - Read $D01E, save to c_saved (for asteroid check later in same frame)
#     - Test bit 1 (sprite 0 vs sprite 1)
#     - No bit → return
#
#   Distance gate:
#     Accept collision ONLY if |player_X − enemy_X| < 18 AND
#                              |player_Y − enemy_Y| < 18
#     This prevents false positives from edge-overlap hardware triggers
#     (VIC-II collision fires when any pixel lines overlap, even if the
#     visible shapes don't touch).  Computes abs(Xdiff) and abs(Ydiff)
#     via subtract, branch on carry, EOR #$FF + ADC #1 if negative.
#     If either distance ≥ 18, reject (no collision).
#
#   Collision response:
#     1. Write c_saved back to $D01E (acknowledge)
#     2. Decrement lives
#     3. Respawn enemy on opposite side:
#          If player X < 128: spawn at X=200
#          Else:              spawn at X=50
#          If player Y < 140: spawn at Y=210
#          Else:              spawn at Y=60
#        (This puts the enemy roughly opposite the player.)
#     4. Play death boom via death_boom: layered two-voice explosion
#        (voice 3 noise sweep + voice 2 pulse sub-drop, 60 frames)
#        with a red/white border flash — see System 13.
#     5. Set state = DYING, state_tmr = 150, flash_tmr = 0
#     6. Return (skip asteroid check — state already changed)
#
# Player-asteroid collision (ast_collision):
#
#   Pre-checks:
#     - State != PLAYING → return
#     - Player in DMZ → return
#     - hit_timer > 0 → return
#
#   Hardware check:
#     - Test c_saved bits 2–4 (sprite 0 vs sprites 2/3/4)
#     - No bits set → return
#
#   Distance gate (per active asteroid slot):
#     For each active slot (0→2):
#       If |player_X − asteroid_X| < 18 AND |player_Y − asteroid_Y| < 18:
#         Real hit detected
#     Same abs-diff calculation as enemy collision.
#
#   Collision response (same as enemy):
#     1. Acknowledge $D01E
#     2. Decrement lives
#     3. Set state = DYING, state_tmr = 150, flash_tmr = 0
#     4. Clear hit_timer
#     5. Play death boom via death_boom (60-frame two-voice sweep +
#        border flash — see System 13).
#
# Hit invincibility:
#   After respawning from DYING: hit_timer = 150 (≈ 3 sec invincibility).
#   Collision is ignored until hit_timer reaches 0.
#
# After restart: hit_timer = 10 (brief grace period).
#


# =============================================================================
# System 7 — Dying State (do_die)
# =============================================================================
#
# Flash effect:
#   flash_tmr counts 0→4 each cycle.
#   When flash_tmr reaches 0:
#     Toggle sprite 0 enable bit in $D015 (EOR #$01).
#     Reset flash_tmr = 4.
#   Visible as player flickering on/off at ~6 Hz.
#
# Timer:
#   state_tmr decrements each frame.
#   When it reaches 0:
#     If lives > 0:
#       Respawn: re-enable sprites ($D015=$03), hit_timer=150,
#       set state=PLAYING, enemy position synced from variables,
#       clear go_drawn.
#     If lives == 0:
#       Disable enemy sprite ($D015=$01, only player visible),
#       set state=GAME_OVER, clear go_drawn.
#
# During dying: enemy and asteroids continue to be updated so they
# don't freeze — only collision checks are suppressed (by state != PLAYING
# gates in collision_do and ast_collision).
#


# =============================================================================
# System 8 — Game Over (do_over)
# =============================================================================
#
# One-shot display (go_drawn flag):
#   Calls draw_gameover on first frame:
#     - Set colour RAM rows 12–13 all white (1)
#     - Clear screen RAM rows 12–13 (fill with space $20)
#     - Write "game over" at row 12, col 16
#   Play game-over sound via sfx_drone (low pulse rumble, ~60 Hz, 30 fr):
#     auto-cleared by sfx_gate_off when sfx_dur reaches 0.

# Wait loop (subsequent frames):
#   - Run sound_tick (handles both legacy snd_timer and sfx_gate_off)
#   - Check SPACE bar (write $7F to $DC00, read $DC01 bit 4)
#   - If SPACE pressed: call restart, return
#   - Else: loop
#
# Restart subroutine:
#   1. Reset variables: lives=3, score=0, state=PLAYING, state_tmr=0,
#      snd_timer=0, speed_ctr=0, go_drawn=0, last_safe=0, zone_ticks=0
#   2. hit_timer = 10 (initial grace period)
#   3. Reset player position: X=160, Y=120, clear MSB bit 0
#   4. Reset enemy position: X=100, Y=80, clear MSB bit 1
#   5. Enable sprites 0+1 ($D015=$03)
#   6. Reset asteroid system:
#        level=1, speed_frac=128, ast_timer=40
#        ast_active=0, ast_msb=0, ast_warn_dir=255
#        ast_warn_x=0, ast_warn_y=0
#        All 3 asteroid VIC positions off-screen (X=0, Y=250)
#   7. Restore colour RAM rows 12–13 to zone colours (green 0–12,
#      black 13–27, blue 28–39)
#   8. Clear screen RAM rows 12–13 (fill with $A0 solid blocks)
#
# Note: do_init is NOT re-run.  Only restart.  (do_init is only re-run
#       on the splash→play transition, which resets init_done=0.)
#


# =============================================================================
# System 9 — Level System (level_update)
# =============================================================================
#
# Level-up trigger (binary thresholds — the score's HIGH byte IS
# the level gate; all thresholds are page-aligned):
#   threshold hi for reaching level+1 = 2*level - 2
#   (level 1 -> $01: level 2 at 256; level 2 -> $02: level 3 at
#   512; level 3 -> $04: level 4 at 1024; then every 512 —
#   level 5 at 1536, level 6 at 2048, ...)
#   When score hi reaches the threshold:
#     level++
#     If level >= 5 and lives < 9: lives++  (survival reward —
#     softens the difficulty ceiling; HUD life digit caps at 9)
#     If level >= 3: pwr_avail = 1  (award powerup charge)
#     Apply new difficulty from tables
#     Play sfx_coin chime
#
# Levels continue beyond 5 — the counter, HUD (2-digit display) and
# transition screen show the real number.  Only the difficulty table
# lookup caps (index clamped to 5, the last table row).
#
# Difficulty tables:
#   level_speeds:  [128,  128,  128,  154,  179]  = 25, 25, 25, 30, 35 px/s
#   level_spawns:  [40,   40,   30,   25,   24]   = asteroid spawn interval (frames)
#
#   Level 1:  25 px/s,   spawn every 40 frames,  0 asteroids (≤ level 2 gate)
#   Level 2:  25 px/s,   spawn every 40 frames,  max 1 asteroid
#   Level 3:  25 px/s,   spawn every 30 frames,  max 1 asteroid
#   Level 4:  30 px/s,   spawn every 25 frames,  max 2 asteroids
#   Level 5+: 35 px/s,   spawn every 20 frames,  max 3 asteroids
#
#   Level 1 has no asteroid spawns (ast_spawn returns if level < 2).
#   At level 5+: enemy sprite colour pulsates red ↔ light red every 8 frames.
#
# Level-up sound via sfx_coin:
#   Two-note triangle chime E-5 → A-5, 6 frames per note (~0.24s).
#   The second note completes during the 90-frame transition screen
#   (gstart ticks sfx_tick_all before dispatching to do_transition).
#
# On reaching level 2: also call ast_preview to pre-roll first asteroid
#   warning direction immediately.
#


# =============================================================================
# System 10 — Asteroid System (ast_spawn + ast_update + ast_preview)
# =============================================================================
#
# The asteroid system manages three VIC-II hardware sprites (indices 2–4)
# that fly across the screen in straight lines from the four edges.
# All three share the same rock sprite data ($2400, pointer $90).
# Active slots are tracked in ast_active bitmask.
#
# --- Spawn direction table (ast_angles, 32 signed-byte pairs) ---
#
# 8 directions, each with 4 speed variants:
#   Bottom→up:     dy∈{−3,−2,−1}, dx∈{−1,0,+1}
#   Top→down:      dy∈{+3,+2,+1}, dx∈{−1,0,+1}
#   Right→left:    dx∈{−3,−2,−1}, dy∈{−1,0,+1}
#   Left→right:    dx∈{+3,+2,+1}, dy∈{−1,0,+1}
#
# Speed gate (in ast_spawn, after the pick and before the slot commit):
#   Levels 1–4 clamp both velocity components to |2| px/frame — the
#   ±3 variants are reserved for level 5+ (the max difficulty tier).
#   The clamp covers both the random pick and the radar pre-rolled
#   path; direction signs are untouched, so radar warnings stay
#   accurate.
#
# Level colour (in ast_spawn, slot 0 only — right after the clamp):
#   Level 2: yellow (7).  Level 3+: white (1).  Slots 1/2 keep their
#   fixed orange/light-red colours from do_init.  Written at spawn
#   time so it survives the do_init re-run after each transition
#   (do_init resets $D029 to yellow; the next spawn re-applies the
#   level colour).
#
# --- Spawning (ast_spawn, called when ast_timer reaches 0) ---
#
# 1. Check level: if level < 2, return (no asteroids).
#
# 2. Count active asteroids.  Compare with level max:
#      L2–L3: max 1  |  L4: max 2  |  L5+: max 3
#    If at or above max, shuffle LFSR and return.
#
# 3. If ast_warn_dir != 255 (pre-rolled warning pending):
#      Use pre-rolled velocity and position; the warning is CONSUMED
#      (ast_warn_dir → 255) and the marker lingers (ast_pdly = 8) so the
#      radar keeps showing the arrival cell while the rock crosses it.
#      Every pre-roll feeds at most ONE spawn — a rock can never reuse
#      a previous rock's marker cell or velocity.  (An earlier version
#      left the pre-roll in place and ticked the linger once per spawn,
#      so up to 8 rocks poured out of the same marker on every level.)
#    Else (no pre-roll — fresh level / after respawn):
#      Read CIA timer ($DC04) XOR raster ($D012), mask to $1F, ×2
#      → index into ast_angles table.
#
# 4. Determine spawn edge from velocity:
#      dy < 0  → Bottom edge:  Y=210, random X via LFSR (40–167)
#      dy > 0  → Top edge:     Y=50,  random X via LFSR (40–167)
#      dx < 0  → Right edge:   X=255, random Y via LFSR (50–229)
#      dx ≥ 0  → Left edge:    X=24,  random Y via LFSR (50–229)
#
# 5. Find free slot (0→2) where ast_active bit is clear.
#    If all full, return.
#
# 6. Store position, velocity, set active bit, write VIC registers,
#    clear MSB for this slot.
#
# 7. Shuffle LFSR, return — the next warning is pre-rolled by
#    ast_update when the marker linger (ast_pdly, 8 frames) expires.
#
# 8. Reset spawn timer from level_spawns table.
#
# --- Movement (ast_update, runs every frame) ---
#
# Spawn timer: ast_timer counts down each frame; at 0 ast_spawn runs
# (see above) and the timer resets from level_spawns.  After the spawn,
# if no warning is pending AND no marker is lingering (ast_warn_dir
# == 255 && ast_pdly == 0 — fresh level start or respawn), ast_preview
# runs immediately so the radar shows the next rock's cell right away.
#
# Marker linger: ast_pdly > 0 → decrement each frame; at 0 call
# ast_preview (moves the marker to the next rock's cell).  Tick runs
# once per FRAME — never once per spawn — so the marker sits on the
# arrival cell for exactly ~8 frames while the rock crosses it.
#
# For each active asteroid slot (0→2):
#   Y:  ast_y += ast_dy   (signed 8-bit add, wraps at boundaries)
#   X:  ast_x += ast_dx   (signed 8-bit add, handles MSB)
#       If dx ≥ 0 and carry: set MSB bit for this slot
#       If dx < 0: clear MSB bit for this slot
#       (MSB handled via $D010 — ast_msb variable tracks bits)
#
#   Write to VIC registers ($D004/$D005, $D006/$D007, $D008/$D009)
#   using indexed addressing (X register = slot index).
#
#   Despawn check:
#     Y < 10 OR Y > 235 → despawn (clear active bit)
#     X < 8            → despawn
#     (Right-edge asteroids despawn via Y-bound; no right X bound needed
#     since they exit right and hit Y bounds or fly off-screen with MSB.)
#     Despawn guard (dy sign): the Y<10 sweep only applies to upward
#     rocks (dy < 0).  Down-moving/sideways rocks (dy ≥ 0 — including
#     top spawns entering at Y=0) are exempt, or their first steps at
#     the border would kill them instantly.
#
#   After movement loop: re-sync $D015 with ast_active bitmask.
#     Only during PLAYING state.
#     Bits 2–4 in $D015 correspond to asteroid slots 0–2.
#
# --- Preview / radar warning (ast_preview) ---
#
# Pre-rolls the NEXT asteroid's direction and spawn position so the
# radar sprite can show it in advance.  It is called by ast_update
# when the marker linger (ast_pdly) expires — i.e. ~8 frames after the
# previous rock spawned FROM the marker cell and started crossing it —
# and by level_update when level 2 is reached.  Never called more than
# once per consumption: each pre-roll feeds exactly one spawn.
#
# 1. Only runs if state == PLAYING.
# 2. Pick random angle (CIA XOR raster, same method as spawn), then
#    classify the EDGE by ANGLE GROUP INDEX (0-7 bottom, 8-15 top,
#    16-23 right, 24-31 left — the table groups ARE the edges).  Old
#    sign-test classification misrouted diagonals (a down-left top
#    angle has dx<0 and fell into the right-edge branch, warning rocks
#    into the DMZ), so spawn + preview share ONE rule.
# 3. Store velocity in ast_next_vx, ast_next_vy.
# 4. Compute spawn position (same edge rules as spawn) and store in
#    ast_warn_x, ast_warn_y.  Edge rules (the warn cell IS the spawn
#    cell AND the marker position — positions computed on the CORRECT
#    sprite-Y map: the C64 text window spans sprite-Y 50..250 (row 0 =
#    50-58 … row 24 = 242-250), so a row N entry lives at Y = 50+8N.
#    Entries: BOTTOM Y=228 (row 22 — sprite-Y 226-234, 6 px up from
#    the old 234 baseline so the marker clears the bottom text row
#    edge), TOP Y=60 (row 1 = sprite-Y 58-66;
#    moved up 2 px from 62 so the marker reads as one clean grid cell
#    edge-to-edge with the HUD row), LEFT X=24, RIGHT X=224
#    (6 px left of the DMZ threshold); side entries
#    randomise the along-edge coordinate in the visible band
#    (Y 62-226).  (Earlier values 16/24/176/210 were computed against
#    a 0-based field and landed rows 1 row short / in the borders —
#    the recurring "above the border / far up" reports.)
# 5. Set ast_warn_dir (0=bottom, 1=top, 2=right, 3=left).
# 6. Shuffle LFSR.
#


# =============================================================================
# System 11 — Radar Warning Indicator (radar_do)
# =============================================================================
#
# Sprite 5 (radar) shows the EXACT spawn position of the next asteroid
# BEFORE it appears, giving the player a visual warning.  The marker is
# deliberately not an abstract "edge pin": it sits precisely where the
# rock will materialise, so the arrival reads as the warned object
# crossing the border (a prior version pinned Y=59 top / Y=229 bottom /
# X=230 right and drifted 19-51 px from the real entry — the "rock
# appears in front of the radar" bug).
#
# Logic:
#   If state != PLAYING → hide radar ($D015 bit 5 cleared)
#   If ast_warn_dir == 255 AND ast_pdly == 0 → hide radar (nothing
#     pre-rolled and nothing lingering on a consumed cell)
#   Else:
#     Position radar sprite (5) at (ast_warn_x, ast_warn_y):
#     - normal case: the next rock's pending arrival cell
#     - linger case (ast_pdly > 0, warning consumed by a spawn): the
#       cell the just-spawned rock is crossing — the marker stays put
#       ~8 frames, then ast_update pulls the next warning and it
#       teleports to the new cell.  (An earlier version cleared the
#       pre-roll at spawn but let rocks re-use the same cell: several
#       rocks left from one marker on every level.  Now the consume
#       happens at spawn and the linger is decoupled per-frame.)
#     (preview values are always visible-friendly; no clamps needed
#     here.)
#
#   Enable sprite ($D015 | $20).
#   On first frame of visibility (edge from hidden): play sfx_boop ping.
#   radar_was tracks visibility edge — set on show, cleared on hide/restart.
#   radar_was also reset in ast_preview when a new warning direction is set.
#
# The marker linger (ast_pdly) is ticked by ast_update once per PLAYING
# frame (not per spawn); at zero it pre-rolls the next warning, which
# moves the marker to the next rock's cell.  restart() and the
# level-transition clear reset ast_warn_dir AND ast_pdly together.
#
# The radar sprite data is a crosshair target:
#   8×8 diamond at the centre of 24×21 grid, transparent elsewhere.
#   Surrounding bytes are $00 (transparent).
#


# =============================================================================
# System 12 — DMZ Visual Noise (dmz_do + dmz_init)
# =============================================================================
#
# The safe zone (DMZ, cols 28–39, rows 1–24, 288 cells total) displays
# continuous random-colour static, à la Yars' Revenge neutral zone.
#
# Refresh timer:
#   dmz_timer counts down from 3 to 0 each frame.
#   When it reaches 0: reset to 3, refresh all 288 cells.
#   Refresh rate: 50/3 ≈ 16.7 Hz — fast enough to shimmer, slow enough
#   to not strobe.
#
# Per-cell colour:
#   For each cell in the 12×24 DMZ grid:
#     Advance Galois LFSR (dmz_seed)
#     AND with $0F → random colour 0–15
#     Write directly to colour RAM at $D800 + row*40 + 28 + col
#
# The LFSR is a Galois 8-bit configuration:
#   Shift right.  If carry (bit 0 was 1): XOR seed with $2D.
#   If result is 0: set seed to $5A (prevents terminal zero state).
#   Polynomial: x^8 + x^5 + x^3 + x^2 + 1  ($2D = %00101101)
#
# Row calculation uses d_mul40: row × 40 using (row << 3) + (row << 5).
#
# Initial fill (dmz_init):
#   Called once during do_init.  Same process but uses a restricted
#   palette: picks from dmz_colors table (8 colours, masked to 0–7).
#   This gives a cooler blue/cyan/purple base before the full-range
#   random static takes over.
#
# PALETTE REFERENCE:
#   0=black  1=white    2=red      3=cyan
#   4=purple 5=green    6=blue     7=yellow
#   8=orange 9=brown   10=lt.red  11=dark grey
#  12=mid grey 13=lt.green 14=lt.blue 15=lt.grey
#


# =============================================================================
# System 13 — Sound Effects (sound_tick + presets)
# =============================================================================
#
# The game uses Atari 2600-inspired sound presets from sound_presets.acme.
# All use pulse or noise waveforms with instant ADSR ($00) for raw TIA-style
# character — no envelope shaping, just hard gating.
#
#   Death (collision hit):
#     death_boom — 60-frame layered explosion triggered by both
#     death paths (collision_do and .ac_real_hit) and ticked
#     every frame from gstart:
#       voice 3 noise sweeps $18 → $7E with the sustain fading
#       over the last 24 frames;
#       voice 2 pulse sub-drop sweeps $04 → $40;
#       sweeps are computed from the countdown and stored with
#       plain STA — never INC a SID register (read-modify-write
#       reads bus garbage on write-only registers);
#       border flashes red/white at 25 Hz for the first 40
#       frames, then returns to normal (11);
#       end of boom gates both voices off (release 0).
#     engine_do yields voice 2 while boom_tmr > 0.  boom_tick is
#     a no-op when inactive — it must never gate voice 3 in idle
#     or the enemy-respawn sfx_explosion would die a frame later.
#
#   Level-up (score threshold and SPACE cheat):
#     sfx_coin — voice 1, two-note triangle chime E-5 → A-5,
#     6 frames per note.  The tick clears sfx_kind after note 2
#     (a framework bug left it set, re-playing the note every
#     ~5 s forever — audible over the death boom).
#
#   Game-over:
#     sfx_drone — voice 1, low pulse rumble (~60 Hz), 30 frames.
#
#   Powerup:
#     sfx_powerup — voice 1, ascending 4-note arpeggio.
#
#   Radar warning appears:
#     sfx_boop — voice 1, low blip.
#
#   Enemy respawn: silent — the 60-frame death_boom covers the
#   moment (the old bundled sfx_explosion was removed).
#
# Ship engine (engine_do, voice 2 — continuous noise rumble):
#   Called every frame from gstart (after anim_update).  Gates on while
#   moving in the PLAYING state.  Noise waveform at low frequency —
#   the classic 2600/C64 "spaceship thrust" white-noise rumble; the
#   base frequency is direction-tuned from engine_freqs[player_dir]:
#     right ~ mid rumble ($2600), left ~ deeper rumble ($2E00),
#     up    ~ hissier thrust ($1C00), down ~ deepest churn ($4000)
#   The framework LFSR (random) churns the low byte each frame
#   (+0..$7F with carry) so the exhaust sounds alive instead of a
#   static tone.  Attack 0/decay 8, sustain 8 (half volume),
#   release 0 — gate-off silences instantly.  Idle (player_moving == 0)
#   or any non-PLAYING state gates it off.  do_transition gates it off
#   explicitly because gstart is bypassed there.
#   Voice 2 is never touched by sfx_gate_off (voices 1+3 only), so
#   presets can't clobber the rumble.  Routine + table live at $2940,
#   after the splash strings (code region is full).
#
# sound_tick (called each frame):
#   - Calls sfx_gate_off to handle sfx_dur-based gate-off
#   - Decrements legacy snd_timer, gate-off voice 1 when zero
#
# gstart dispatcher calls sfx_gate_off + sfx_tick_all every frame
# to handle both single-shot and multi-frame sound presets.
# sfx_gate_off auto-clears voice 1 + 3 when sfx_dur reaches 0.
#


# =============================================================================
# System 14 — Splash Screen (do_splash + draw_splash + splash_bars)
# =============================================================================
#
# The splash block is relocated to the extended RAM area ($2A00) —
# the $0801-$2000 code region was full; a guard at the end of the main
# region fails the build if code ever crosses $2000 into the sprite
# data.  All splash branches are local, so the move is transparent.
#
# Runs its OWN frame loop — completely bypasses the main loop's behaviours_update.
# The splash routine owns frame_ready, advances it internally, and never returns
# to the main loop until fire/SPACE transitions to PLAYING.
#
# Initialisation (draw_splash, called once):
#   1. Fill screen RAM ($0400–$07E7) with $A0 (solid block)
#   2. Fill colour RAM ($D800–$DBE7) with 0 (black)
#   3. Write title: "last star system" → row 10, col 12, colour white (1)
#   4. Write prompt: "press fire to play" → row 14, col 11, colour lt.grey (15)
#   5. Write loader hint: "f1 or 1-5: level select" → row 16, col 11, lt.grey (15)
#   6. Write credit: "gpowerf 2026" → row 22, col 14, colour lt.grey (15)
#   7. Text via !scr (lowercase ASCII → PETSCII screen codes)
#      The ds_press / ds_hint / ds_credit strings live at $2900 —
#      after the sound presets, clear of both the code region (which
#      is guarded against crossing $2000 into the base sprite data)
#      and the sprite/sfx data.  The menu strings sit at the end of the
#      extended splash block ($2A00+), after the title glyphs.
#      (Strings previously sat at the end of the code region and were
#      silently overwritten by ship_r.spr when the code grew past
#      $2000 — the title screen showed garbage.)
#
# Frame loop (splash_wait, runs every frame after draw):
#   1. Disable all sprites ($D015 = 0)
#   2. Wait for frame_ready (busy-wait on frame_ready==0, then clear it)
#   3. Call splash_bars — shimmer side columns 0–3 and 36–39
#   4. Keyboard fire — SPACE (write $7F → $DC00, read $DC01 bit 4):
#      start the game (level 1 unless start_level was pre-set)
#   5. M (matrix line 4, write $EF → $DC00, read $DC01 bit 4): open the
#      level-select loader (System 15).  Deliberately NOT F1 — line 0 is
#      RETURN's line and the harness types "sys2061\r" at boot; a
#      per-frame line-0 scan collides with that CR delivery.  Line 4
#      carries no keystroke of the boot typing.
#   6. Joystick port 2 fire (write $00 → $DC02, read $DC00 bit 4,
#      restore $FF → $DC02): start the game
#   7. Testability hook: if state != GAME_SPLASH, exit via the normal
#      start path.  Inert during real play (nothing writes state while
#      splashing) — VICE-monitor tests poke state to leave the splash.
#   8. If a start trigger fired (or state changed):
#        - Border back to dark grey ($D020 = 11)
#        - If start_level == 0: set it to 1
#        - Set init_done = 0  (forces do_init re-run with game screen),
#          which consumes start_level (level, speed, score threshold,
#          enemy colour — see System 15)
#        - Enable sprites 0+1 ($D015 = $03)
#        - Set state = PLAYING
#        - Return to main loop (splash never runs again)
#      Else:
#        - Jump back to the loop top (splash_wait label) forever
#
#   NOTE: the only extra matrix scan beyond the base's SPACE line is M
#   on line 4 — chosen because the boot typing ("sys2061\r") never
#   touches line 4, while RETURN (the CR) lives on line 0.
#
# The loop top is a global label (splash_wait) so the test harness can
# breakpoint inside the loop — main_loop is unreachable while splashing.
#
# Side bars (splash_bars, called from frame loop):
#   - dmz_timer-style 3-frame cycle
#   - Refresh cols 0–3 and 36–39 on every row (25 rows × 8 cells = 200 cells)
#   - Per-cell: LFSR → random colour (AND $0F) → colour RAM
#   - Uses d_mul40 for row×40 address calculation
#   - Creates shimmer effect matching DMZ aesthetic
#   - Narrowed from 0–5/34–39 so the chrome title (cols 4–35) is never
#     colour-clobbered
#
# Transition to gameplay:
#   init_done = 0 causes do_init to run again next frame, overwriting
#   the splash screen with the game's 3-zone colour RAM layout, HUD
#   header, and sprite initialisation.
#


# =============================================================================
# System 15 — Level-Select Loader (menu_wait + loader_draw)
# =============================================================================
#
# Classic cracked-loader screen, opened with M from the splash:
#   - white border, black screen, "***** start level *****" header
#   - items 1-5 ("n .. start at level n"), ">" marker on the selection
#   - footer: fire/space play | 1-5 jump | f1 back
#
# Input (menu_wait, owns frame_ready like splash_wait):
#   - digits 1-5 (matrix lines 7/1/2): jump straight to that level
#   - joystick up/down (lines... port 2 bits 0/1): move the marker
#   - joystick fire OR SPACE: confirm the highlighted level
#   - F1 (line 0 — safe here, the boot typing is long done): back out
#
# Floating-line guard: unplugged joysticks can read phantom lows, and a
# stuck line would confirm instantly.  menu_wait therefore runs EDGE
# detection (menu_joy AND NOT menu_prev) and ARMS on its first frame
# (menu_armed: sample the idle state, act only on later transitions).
#
# Strings are LOWERCASE !scr: this game's charset renders lowercase-
# typed text as caps; UPPERCASE-typed text lands as raw ASCII and
# displays as graphics garbage (root cause of the first cut's garble).
#
# Start-level application (do_init, main region):
#   start_level (0/1 = level 1, 2-5 = selected) drives a fresh start:
#     level = start_level
#     speed_frac = level_speeds[level-1]   (level > 5 clamps to the L5 row)
#     score = the level's binary threshold, "as if earned":
#              level 2 → 256, 3 → 512, 4 → 1024, 5 → 1536
#              (score+1 = $01/$02/$04/$06 — all below the NEXT level-up
#               threshold, so no instant re-level-up at boot)
#     $D028 = light red at level 5+, red otherwise (level_update rule)
#   No powerup charge or survival life is awarded by a level-select
#   start: those are level-up transition awards only.  restart (game-
#   over) always resets to level 1 and does NOT read start_level.
#   The VICE tests drive the plumbing directly (poke start_level + the
#   splash hook): level_select_starts_at_picked_level.
#
# =============================================================================
# System 16 — DMZ Counter (score_do DMZ path)
# =============================================================================
#
# DMZ entry tracking:
#   - MSB bit set (X ≥ 256) always considered in DMZ
#   - X low byte >= 224 (without MSB): in DMZ
#   - Must NOT be in last_safe state AND not in DMZ for penalty:
#       On entry: score −5, clamp to 0 on underflow
#       Set last_safe = 1  (prevents re-penalty until leaving DMZ)
#   - In DMZ: zone_ticks = 0  (no green-zone credit)
#   - Leaving DMZ: last_safe = 0  (re-arms penalty for next entry)
#
# =============================================================================
# System 17 — Powerup (Fire-Triggered Invincibility Charge)
# =============================================================================
#
# Reaching level 3 (or higher) awards one invincibility charge.
# The charge is triggered manually with FIRE (joystick port 2) or
# SPACE (keyboard), granting 2 seconds (100 frames) of flashing
# invincibility.  No powerup sprite exists — it is an ability, not
# an item.
#
# Award (in level_update):
#   After level++, if level >= 3:
#     pwr_avail = 1
#   Charge is capped at 1 (leveling up again refreshes it).
#   A loader level-start does NOT award charges (bypasses the
#   score-threshold path).
#
# Trigger (pwr_check, called from do_play each PLAYING frame):
#   Reads FIRE:  $DC02 = $00 (all inputs), $DC00 bit 4, restore $FF.
#   Reads SPACE (= keyboard fire): $7F → $DC00, $DC01 bit 4.
#   Edge detection via pwr_key (press/release latch pattern):
#     pwr_key = 0 while held, 1 when released.
#     Trigger only on the released → pressed edge.
#   On trigger:
#     pwr_avail = 0 (consumed)
#     hit_timer = max(hit_timer, 100)   — keeps longer existing
#                                         invincibility intact
#     pwr_flash = 0
#     jsr sfx_powerup (ascending 4-note arpeggio, voice 1)
#   Reusing hit_timer means collision_do and ast_collision need no
#   changes — immunity is automatic.
#
# Unified invincibility flash (end of do_play):
#   While hit_timer > 0: pwr_flash counts 4-frame cycles; at 0 it
#   toggles $D015 bit 0 (sprite 0 visibility) and resets to 4.
#   This applies to ALL invincibility — the powerup and the existing
#   150-frame post-respawn grace — so flashing always means immune.
#   When hit_timer reaches 0, sprite 0 is force-enabled
#   (ORA #$01) so the flash never ends on a hidden frame.
#   DYING uses its own flash (do_die + flash_tmr); the two states
#   never overlap because do_play only runs in PLAYING.
#
# HUD indicator (gstart, all non-splash states):
#   pwr_avail = 1 → PETSCII $10 ("P") at $0400+28, white (1) at
#   $D800+28.
#   pwr_avail = 0 → space + black.
#   Safe: the DSL HUD writes cols 0–26 only; dmz_do writes rows 1–24.
#
# Lifecycle:
#   restart: pwr_avail = pwr_flash = pwr_key = 0.
#   Transition: charge persists (it was just awarded); hit_timer = 30
#     may shorten an active powerup — acceptable.
#   Death while powered: DYING stops the flash; respawn sets
#     hit_timer = 150 and $D015 = $03 (sprite visible).
#
# =============================================================================

