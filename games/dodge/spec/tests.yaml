# Test definitions — executed as live VICE tests via remote monitor

tests:
  - name: build_succeeds
    steps:
      - check: {what: sprite_x, index: 0, gte: 24}
      - check: {what: sprite_y, index: 0, gte: 50}
      - check: {what: sprite_x, index: 1, gte: 24}
      - check: {what: sprite_y, index: 1, gte: 50}

  - name: enemy_moves_toward_player
    steps:
      - poke: {addr: $d000, value: 200}
      - poke: {addr: $d001, value: 120}
      - poke: {label: enemy_x, value: 50}
      - poke: {label: enemy_y, value: 120}
      - poke: {addr: $d010, value: 0}
      - poke: {label: speed_ctr, value: 1}
      - poke: {label: enemy_init, value: 1}
      - poke: {label: hit_timer, value: 255}
      - advance: 1
      - check: {what: sprite_x, index: 1, gt: 50}

  - name: stability_10_frames
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: hit_timer, value: 255}
      - poke: {label: speed_ctr, value: 0}
      - advance: 10
      - check: {what: memory, label: state, eq: 0}

  - name: level5_spawn
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 5}
      - poke: {label: hit_timer, value: 255}
      - poke: {label: ast_active, value: 0}
      - poke: {label: ast_timer, value: 1}
      - advance: 10
      - check: {what: memory, label: state, eq: 0}

  - name: collision_costs_life
    steps:
      - poke: {addr: $d000, value: 100}
      - poke: {addr: $d001, value: 100}
      - poke: {label: enemy_x, value: 100}
      - poke: {label: enemy_y, value: 100}
      - poke: {addr: $d002, value: 100}
      - poke: {addr: $d003, value: 100}
      - poke: {addr: $d010, value: 0}
      - poke: {label: lives, value: 3}
      - poke: {label: state, value: 0}
      - poke: {label: hit_timer, value: 0}
      - poke: {label: speed_ctr, value: 0}
      - poke: {label: enemy_init, value: 1}
      - advance: 1
      - check: {what: memory, label: lives, eq: 3}
