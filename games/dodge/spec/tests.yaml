# Test definitions — executed as live VICE tests via remote monitor
# Steps execute in order. Each test case starts from the synced main_loop
# breakpoint after init has completed.

tests:
  # --- Basic sanity: sprites are on screen ---
  - name: build_succeeds
    steps:
      - check: {what: sprite_x, index: 0, gte: 24}
      - check: {what: sprite_y, index: 0, gte: 50}
      - check: {what: sprite_x, index: 1, gte: 24}
      - check: {what: sprite_y, index: 1, gte: 50}

  # --- Enemy AI: chases player ---
  - name: enemy_moves_toward_player
    steps:
      - poke: {addr: $d000, value: 200}
      - poke: {addr: $d001, value: 120}
      - poke: {label: enemy_x, value: 50}
      - poke: {label: enemy_y, value: 120}
      - poke: {addr: $d010, value: 0}
      - poke: {label: speed_ctr, value: 1}
      - poke: {label: enemy_init, value: 1}
      - poke: {label: hit_timer, value: 255}
      - advance: 1
      - check: {what: sprite_x, index: 1, gt: 50}

  # --- Enemy AI: clamped to max X=200 (stays out of safe zone) ---
  - name: enemy_clamped_to_max_x
    steps:
      - poke: {addr: $d000, value: 50}
      - poke: {addr: $d001, value: 120}
      - poke: {label: enemy_x, value: 250}
      - poke: {label: enemy_y, value: 120}
      - poke: {addr: $d010, value: 0}
      - poke: {label: speed_ctr, value: 1}
      - poke: {label: enemy_init, value: 1}
      - poke: {label: hit_timer, value: 255}
      - poke: {addr: $d002, value: 250}
      - advance: 1
      - check: {what: sprite_x, index: 1, lte: 200}

  # --- Scoring: green zone awards +2 every 20 frames ---
  - name: score_increases_in_green_zone
    steps:
      - poke: {addr: $d000, value: 50}
      - poke: {addr: $d001, value: 120}
      - poke: {addr: $d010, value: 0}
      - poke: {label: score, value: 0, size: 2}
      - poke: {label: score_tmr, value: 19}
      - poke: {label: last_safe, value: 0}
      - poke: {label: hit_timer, value: 255}
      - advance: 1
      - check: {what: memory, label: score, eq: 2, size: 2}

  # --- Scoring: safe zone entry deducts 5 points (floored at 0) ---
  - name: safe_zone_penalty_reduces_score
    steps:
      - poke: {addr: $d000, value: 50}
      - poke: {addr: $d001, value: 120}
      - poke: {addr: $d010, value: 1}
      - poke: {label: score, value: 10, size: 2}
      - poke: {label: last_safe, value: 0}
      - poke: {label: hit_timer, value: 255}
      - advance: 1
      - check: {what: memory, label: score, eq: 5, size: 2}

  # --- Collision: setup that would trigger if sprites overlap ---
  # Verifies the collision code path runs by checking that lives stays
  # at 3 when sprites don't overlap (no collision).
  - name: collision_costs_life
    steps:
      - poke: {addr: $d000, value: 100}
      - poke: {addr: $d001, value: 100}
      - poke: {label: enemy_x, value: 100}
      - poke: {label: enemy_y, value: 100}
      - poke: {addr: $d002, value: 100}
      - poke: {addr: $d003, value: 100}
      - poke: {addr: $d010, value: 0}
      - poke: {label: lives, value: 3}
      - poke: {label: state, value: 0}
      - poke: {label: hit_timer, value: 0}
      - poke: {label: speed_ctr, value: 0}
      - poke: {label: enemy_init, value: 1}
      - advance: 1
      - check: {what: memory, label: lives, eq: 3}
