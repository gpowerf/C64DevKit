# c64devk project configuration
project:
  name: "dodge"
  output: "dodge.prg"

memory:
  code_start: 0x0801
  code_end: 0xCFFF
  sprite_data: 0x3400
  sound_presets: 0x3900  # sound preset code+tables — MUST sit above the
                         #  sprite blocks and user sprite bins ($3400-$3881)
                         #  and below $4000; the section is ~$400 bytes
  charset: 0x2000       # ROM charset copied here by framework codegen
                        # (VIC charset block 2 — frees $3800+ and keeps
                        #  the charset out of the sprite/ROM-window space)
  screen_ram: 0x0400

screen:
  mode: hires
  charset: 0x2000       # the EFFECTIVE charset (spec.screen wins over
                        #  game.yaml; MemoryLayout.charset is unused here)
  screen_ram: 0x0400
  background_color: 0   # overridden by color RAM zones in game_init
  border_color: 11      # dark gray

basic: true

constraints:
  max_game_logic_lines: 2500
