# c64devk project configuration
project:
  name: "dodge"
  output: "dodge.prg"

memory:
  code_start: 0x0801
  code_end: 0xCFFF
  sprite_data: 0x2000
  charset: 0x3800       # ROM charset copied here by framework codegen
  screen_ram: 0x0400

screen:
  mode: hires
  background_color: 0   # overridden by color RAM zones in game_init
  border_color: 11      # dark gray

basic: true
