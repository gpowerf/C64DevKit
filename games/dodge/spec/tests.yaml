# =============================================================================
# Sprite Dodge — Test Definitions
# =============================================================================
#
# Tests execute via VICE remote monitor (TCP :6510).
# Commands:
#   poke:    write byte to address or label
#   advance: run N frames
#   check:   assert condition on memory or sprite position
#
# check operators:
#   eq (==), gt (>), gte (>=), lt (<), lte (<=)
#
# check targets:
#   what: memory       → label + expected value
#   what: sprite_x     → index + expected value
#   what: sprite_y     → index + expected value
# =============================================================================

tests:
  # ─── Sanity ──────────────────────────────────────────────────────────
  - name: build_succeeds
    steps:
      - check: {what: sprite_x, index: 0, gte: 24}
      - check: {what: sprite_y, index: 0, gte: 50}
      - check: {what: sprite_x, index: 1, gte: 24}
      - check: {what: sprite_y, index: 1, gte: 50}

  - name: stability_10_frames
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: hit_timer, value: 255}
      - poke: {label: speed_ctr, value: 0}
      - advance: 10
      - check: {what: memory, label: state, eq: 0}

  # ─── State machine ───────────────────────────────────────────────────
  - name: starts_in_splash
    start: splash
    steps:
      - check: {what: memory, label: state, eq: 3}

  - name: splash_stays_until_start
    start: splash
    steps:
      - advance: 30
      - check: {what: memory, label: state, eq: 3}

  # ─── Level select (cracked loader) ─────────────────────────────
  # The loader's key matrix reads can't be driven through the monitor
  # harness, so this exercises the applied path: the splash stores the
  # chosen level in start_level and the testability hook (state poke)
  # takes the same exit path as fire/SPACE.  score sits 2 bytes after
  # the "score" label per variable order — checked via addr.
  - name: level_select_starts_at_picked_level
    start: splash
    steps:
      - poke: {label: start_level, value: 5}
      - poke: {label: state, value: 0}
      - advance: 40
      - check: {what: memory, label: level, eq: 5}
      - check: {what: memory, label: speed_frac, eq: 179}
      - check: {what: memory, addr: $E2A, eq: 6}

  # ─── Player movement ─────────────────────────────────────────────────
  - name: player_x_within_bounds
    steps:
      - poke: {label: state, value: 0}
      - advance: 5
      - check: {what: sprite_x, index: 0, gte: 24}

  - name: player_y_within_bounds
    steps:
      - poke: {label: state, value: 0}
      - advance: 5
      - check: {what: sprite_y, index: 0, gte: 50}

  # ─── Enemy AI ────────────────────────────────────────────────────────
  - name: enemy_moves_toward_player
    steps:
      - poke: {addr: $d000, value: 200}
      - poke: {addr: $d001, value: 120}
      - poke: {label: enemy_x, value: 50}
      - poke: {label: enemy_y, value: 120}
      - poke: {addr: $d010, value: 0}
      - poke: {label: speed_ctr, value: 128}   # +speed_frac(128) → carry → move
      - poke: {label: enemy_init, value: 1}
      - poke: {label: hit_timer, value: 255}
      - advance: 1
      - check: {what: sprite_x, index: 1, gt: 50}

  - name: enemy_not_stuck_when_close
    steps:
      - poke: {addr: $d000, value: 160}
      - poke: {addr: $d001, value: 120}
      - poke: {label: enemy_x, value: 160}
      - poke: {label: enemy_y, value: 120}
      - poke: {addr: $d010, value: 0}
      - poke: {label: speed_ctr, value: 128}
      - poke: {label: enemy_init, value: 1}
      - advance: 5
      - check: {what: sprite_x, index: 1, gte: 24}

  # ─── Collision ───────────────────────────────────────────────────────
  - name: collision_costs_life
    steps:
      - poke: {addr: $d000, value: 100}
      - poke: {addr: $d001, value: 100}
      - poke: {label: enemy_x, value: 100}
      - poke: {label: enemy_y, value: 100}
      - poke: {addr: $d002, value: 100}
      - poke: {addr: $d003, value: 100}
      - poke: {addr: $d010, value: 0}
      - poke: {label: lives, value: 3}
      - poke: {label: state, value: 0}
      - poke: {label: hit_timer, value: 0}
      - poke: {label: speed_ctr, value: 0}
      - poke: {label: enemy_init, value: 1}
      - advance: 2                    # frame 1 draws overlap → frame 2 reads it
      - check: {what: memory, label: lives, eq: 2}

  - name: collision_dmz_immune
    steps:
      - poke: {addr: $d000, value: 230}
      - poke: {addr: $d001, value: 100}
      - poke: {label: enemy_x, value: 230}
      - poke: {label: enemy_y, value: 100}
      - poke: {addr: $d002, value: 230}
      - poke: {addr: $d003, value: 100}
      - poke: {addr: $d010, value: 0}
      - poke: {label: lives, value: 3}
      - poke: {label: state, value: 0}
      - poke: {label: hit_timer, value: 0}
      - poke: {label: speed_ctr, value: 0}
      - poke: {label: enemy_init, value: 1}
      - advance: 2
      - check: {what: memory, label: lives, eq: 3}

  - name: collision_cooldown_works
    steps:
      - poke: {label: lives, value: 5}
      - poke: {label: state, value: 0}
      - poke: {label: hit_timer, value: 150}
      - advance: 10
      - check: {what: memory, label: lives, eq: 5}

  # ─── Scoring ─────────────────────────────────────────────────────────
  - name: green_zone_gives_score
    steps:
      - poke: {addr: $d000, value: 40}
      - poke: {addr: $d010, value: 0}
      - poke: {label: state, value: 0}
      - poke: {label: score, value: 0}
      - poke: {addr: score+1, value: 0}   # high byte
      - poke: {label: score_tmr, value: 0}
      - poke: {label: zone_ticks, value: 0}
      - poke: {label: hit_timer, value: 255}
      - advance: 21                      # one full score tick + 1
      - check: {what: memory, label: score, gte: 2}

  - name: neutral_zone_no_score
    steps:
      - poke: {addr: $d000, value: 160}
      - poke: {addr: $d010, value: 0}
      - poke: {label: state, value: 0}
      - poke: {label: score, value: 0}
      - poke: {addr: score+1, value: 0}
      - poke: {label: score_tmr, value: 0}
      - poke: {label: hit_timer, value: 255}
      - advance: 21
      - check: {what: memory, label: score, eq: 0}

  - name: tiered_scoring_ramps_up
    steps:
      - poke: {addr: $d000, value: 40}
      - poke: {addr: $d010, value: 0}
      - poke: {label: state, value: 0}
      - poke: {label: score, value: 0}
      - poke: {addr: score+1, value: 0}
      - poke: {label: score_tmr, value: 0}
      - poke: {label: zone_ticks, value: 37}  # at tier 2→3 boundary
      - poke: {label: hit_timer, value: 255}
      - advance: 21
      - check: {what: memory, label: score, gte: 3}

  # ─── Level system ────────────────────────────────────────────────────
  - name: level_up_on_score_1000
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 1}
      - poke: {label: prev_k, value: 0}
      - poke: {label: score, value: 0}
      - poke: {addr: score+1, value: 10}     # hi byte → score ≈ 2560
      - advance: 2
      - check: {what: memory, label: level, gte: 2}

  - name: level_continues_past_5
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 9}
      - poke: {label: prev_k, value: 0}
      - poke: {label: score, value: 0}
      - poke: {addr: score+1, value: 10}     # hi byte → score ≈ 2560
      - advance: 2
      - check: {what: memory, label: level, eq: 10}
      - check: {what: memory, label: speed_frac, eq: 179}   # difficulty capped

  # ─── Asteroid system ─────────────────────────────────────────────────
  - name: asteroids_spawn_at_level_2
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 2}
      - poke: {label: ast_active, value: 0}
      - poke: {label: ast_timer, value: 1}
      - poke: {label: hit_timer, value: 255}
      - advance: 5
      - check: {what: memory, label: ast_active, gt: 0}

  - name: no_asteroids_at_level_1
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 1}
      - poke: {label: ast_active, value: 0}
      - poke: {label: ast_timer, value: 1}
      - advance: 5
      - check: {what: memory, label: ast_active, eq: 0}

  - name: level5_spawn
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 5}
      - poke: {label: hit_timer, value: 255}
      - poke: {label: ast_active, value: 0}
      - poke: {label: ast_timer, value: 1}
      - advance: 10
      - check: {what: memory, label: state, eq: 0}

  - name: asteroid_seeds_vary
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 2}
      - poke: {label: dmz_seed, value: 1}
      - poke: {label: ast_warn_dir, value: 255}
      - poke: {label: ast_active, value: 0}
      - poke: {label: ast_timer, value: 1}
      - advance: 10
      - check: {what: memory, label: dmz_seed, gt: 0}

  # ─── Restart flow ────────────────────────────────────────────────────
  - name: restart_resets_score
    steps:
      - poke: {label: state, value: 2}
      - poke: {label: go_drawn, value: 0}
      - poke: {label: score, value: 42}
      - poke: {addr: score+1, value: 5}
      - poke: {label: prev_k, value: 5}   # suppress level-up transition
      - advance: 1
      - check: {what: memory, label: go_drawn, eq: 1}

  - name: restart_resets_level
    steps:
      - poke: {label: state, value: 2}
      - poke: {label: level, value: 4}
      - advance: 1
      - check: {what: memory, label: level, eq: 4}   # not reset until SPACE

  # ─── DMZ / safe zone ─────────────────────────────────────────────────
  - name: dmz_seed_nonzero
    steps:
      - advance: 5
      - check: {what: memory, label: dmz_seed, gt: 0}

  - name: dmz_lfsr_changes
    steps:
      - poke: {label: dmz_seed, value: 42}
      - advance: 2
      - check: {what: memory, label: dmz_seed, gt: 0}

  # ─── Sound ───────────────────────────────────────────────────────────
  - name: sound_timer_decrements
    steps:
      - poke: {label: state, value: 2}      # GAME_OVER runs sound_tick
      - poke: {label: go_drawn, value: 1}
      - poke: {label: snd_timer, value: 10}
      - advance: 5
      - check: {what: memory, label: snd_timer, lt: 10}

  # ─── Powerup ─────────────────────────────────────────────────────────
  - name: powerup_awarded_at_level_3
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 2}
      - poke: {label: prev_k, value: 0}
      - poke: {label: score, value: 0}
      - poke: {addr: score+1, value: 10}     # level-up to 3 on next frame
      - poke: {label: pwr_avail, value: 0}
      - advance: 2
      - check: {what: memory, label: level, eq: 3}
      - check: {what: memory, label: pwr_avail, eq: 1}

  - name: powerup_hud_shows_p
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: pwr_avail, value: 1}
      - advance: 2
      - check: {what: memory, addr: $041c, eq: $10}   # screen $0400+28 = "P"

  - name: powerup_hud_clears
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: pwr_avail, value: 0}
      - advance: 2
      - check: {what: memory, addr: $041c, eq: $20}   # space when no charge

  # ─── Radar / asteroid entry points ───────────────────────────────────
  # The radar marker (sprite 5, $d00a/$d00b) must sit at the exact warn
  # position, and the spawned rock must enter there too.  Top spawns
  # enter flush with the top border (Y=0) and rely on the dy≥0 despawn
  # exemption to survive their first steps.  Poke-driven: warn values
  # are set directly, timer armed so the spawn fires on the next frame.
  - name: radar_marker_matches_warn_top
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: ast_timer, value: 200}
      - poke: {label: ast_warn_dir, value: 1}
      - poke: {label: ast_warn_x, value: 100}
      - poke: {label: ast_warn_y, value: 62}
      - advance: 2
      - check: {what: memory, addr: $d00a, eq: 100}
      - check: {what: memory, addr: $d00b, eq: 62}

  - name: radar_marker_matches_warn_bottom
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: ast_timer, value: 200}
      - poke: {label: ast_warn_dir, value: 0}
      - poke: {label: ast_warn_x, value: 120}
      - poke: {label: ast_warn_y, value: 234}
      - advance: 2
      - check: {what: memory, addr: $d00a, eq: 120}
      - check: {what: memory, addr: $d00b, eq: 234}

  - name: top_spawn_enters_at_top_border
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 2}
      - poke: {label: ast_active, value: 0}
      - poke: {label: ast_warn_dir, value: 1}
      - poke: {label: ast_warn_x, value: 100}
      - poke: {label: ast_warn_y, value: 62}
      - poke: {label: ast_next_vx, value: 1}
      - poke: {label: ast_next_vy, value: 3}
      - poke: {label: ast_timer, value: 1}
      - advance: 1
      - check: {what: memory, addr: $d004, eq: 101}   # x: 100 + dx 1
      - check: {what: memory, addr: $d005, eq: 65}    # y: 62 + dy 3 — not despawned
      - check: {what: memory, label: ast_active, eq: 1}

  - name: bottom_spawn_enters_below_screen
    steps:
      - poke: {label: state, value: 0}
      - poke: {label: level, value: 2}
      - poke: {label: ast_active, value: 0}
      - poke: {label: ast_warn_dir, value: 0}
      - poke: {label: ast_warn_x, value: 80}
      - poke: {label: ast_warn_y, value: 234}
      - poke: {label: ast_next_vx, value: 0}
      - poke: {label: ast_next_vy, value: 254}        # dy = -2 (upward)
      - poke: {label: ast_timer, value: 1}
      - advance: 1
      - check: {what: memory, addr: $d004, eq: 80}
      - check: {what: memory, addr: $d005, eq: 232}   # 234 - 2: climbing in
      - check: {what: memory, label: ast_active, eq: 1}
