# Test definitions
# Steps: advance N frames, poke sprites into position, check assertions
# Each test can have setup steps then assertions

tests:
  - name: player_starts_at_configured_position
    steps:
      - advance: 2
      - check: {what: sprite_x, index: 0, eq: 160}
      - check: {what: sprite_y, index: 0, eq: 120}

  - name: enemy_starts_at_configured_position
    steps:
      - advance: 2
      - check: {what: sprite_x, index: 1, eq: 100}
      - check: {what: sprite_y, index: 1, eq: 80}

  - name: score_starts_at_zero
    steps:
      - advance: 2
      - check: {what: memory, label: score, eq: 0, size: 2}
