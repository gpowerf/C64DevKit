# Behavior definitions
# Actions are compiled to 6502 assembly by the behavior DSL compiler.
# Supported actions: read_joystick, update_sprite, set_sprite_pos,
#                    inc_score, play_sound, check_collision, display_text

behaviors:
  - name: move_player
    type: on_frame
    actions:
      - update_sprite: player      # WASD to move sprite 0

  - name: show_score
    type: on_frame
    actions:
      - display_text:
          text: "score:"
          row: 0
          col: 0
          color: 7                 # yellow

  - name: reset_on_collision
    type: on_collision
    sprites: [player, enemy]
    actions:
      - set_sprite_pos:
          sprite: player
          x: 160
          y: 120
      - inc_score: 10
