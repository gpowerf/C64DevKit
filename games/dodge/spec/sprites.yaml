# =============================================================================
# Sprite Dodge — Sprite Definitions
# =============================================================================
#
# Six sprites total (VIC-II indices 0–5):
#   ┌────┬──────────┬───────┬─────────────────────────────┐
#   │ Idx│ Name     │ Colour│ Description                  │
#   ├────┼──────────┼───────┼─────────────────────────────┤
#   │  0 │ player   │   7   │ Ship, 4 directional frames   │
#   │  1 │ enemy    │   2   │ Octopus, chases player       │
#   │  2 │ asteroid_0│  7   │ Rock, L2 yellow → L3+ white  │
#   │  3 │ asteroid_1│  8   │ Rock, spawned at level 4+    │
#   │  4 │ asteroid_2│ 10   │ Rock, spawned at level 5+    │
#   │  5 │ radar    │   7   │ Crosshair target indicator   │
#   └────┴──────────┴───────┴─────────────────────────────┘
#
# Sprite animations (art in assets/sprites/, 24×21 hi-res):
#   player — 2 frames per direction: frame 0 = no trail, frame 1 =
#            exhaust trail.  While moving, frames alternate every 2
#            frames (25 Hz flicker → translucent trail); stationary
#            (or outside PLAYING), frozen on frame 0 — no trail.
#   enemy  — 8-frame fluid tentacle cycle (traveling wave) advancing
#            every 6 frames (file names keep the historical skull* prefix)
#
# Memory layout — sprites at `sprite_data` = $3400, charset at $2000:
#   $3400  ship_r.spr   (player, right, frame 0)  ptr $D0 → $07F8
#   $3440  ship_l.spr   (player, left,  frame 0)  ptr $D1 → $07F8
#   $3480  ship_u.spr   (player, up,    frame 0)  ptr $D2 → $07F8
#   $34C0  ship_d.spr   (player, down,  frame 0)  ptr $D3 → $07F8
#   $3500  skull.spr    (enemy, frame 0)          ptr $D4 → $07F9
#   $3540  ship_r1.spr  (player, right, frame 1)  ptr $D5 → $07F8
#   $3580  ship_l1.spr  (player, left,  frame 1)  ptr $D6 → $07F8
#   $35C0  ship_u1.spr  (player, up,    frame 1)  ptr $D7 → $07F8
#   $3600  ship_d1.spr  (player, down,  frame 1)  ptr $D8 → $07F8
#   $3640  skull1.spr   (enemy, frame 1)          ptr $D9 → $07F9
#   $3680  skull2.spr   (enemy, frame 2)          ptr $DA → $07F9
#   $36C0  skull3.spr   (enemy, frame 3)          ptr $DB → $07F9
#   $3700  skull4.spr   (enemy, frame 4)          ptr $DC → $07F9
#   $3740  skull5.spr   (enemy, frame 5)          ptr $DD → $07F9
#   $3780  skull6.spr   (enemy, frame 6)          ptr $DE → $07F9
#   $37C0  skull7.spr   (enemy, frame 7)          ptr $DF → $07F9
#   $3800  rock.spr     (asteroids)               ptr $E0 → $07FA–$07FC
#   $3840  inline data  (radar crosshair)         ptr $E1 → $07FD
# (The charset lives at $2000–$27FF — see c64devk.yaml.)
#
# The framework uses `data_files` to allocate 4 sprite-pointer slots
# for the player (frame 0).  The pointer is updated every frame by
# game_logic.acme:
#   $07F8 = $80 + player_dir + ship_frame * 5
# where player_dir ∈ {0=right, 1=left, 2=up, 3=down} and ship_frame ∈
# {0, 1} alternates every 2 frames.  The *5 skips over the enemy
# frame 0 at $84.  The enemy (octopus) cycles 7 hand-drawn frames:
#   $07F9 = $84 + enemy_frame  (frame 0)
#   $07F9 = $88 + enemy_frame  (frames 1–6, skipping the 4 ship blocks)
# with enemy_frame ∈ {0..6} advancing every 6 frames (42-frame loop;
# frame 6 is the widest, wrapping back to the rest pose of frame 0).
# Animation frame files (ship_r1/l1/u1/d1, skull1–6) are emitted
# directly by game_logic.acme via `!bin`, not via this spec.
#
# Asteroid sprites (2–4) share the same rock.spr data at $2140.
# They are loaded outside the behaviour DSL by game_logic.acme
# (do_init sets pointers $07FA–$07FC = $90, rock.spr at $2400; sprite
# positions and visibility are managed by the asteroid system).
#
# Radar sprite (5) data is inline at $2440 — a small diamond crosshair
# 8×8 pixels centred in a 24×21 grid, surrounded by transparent bytes.
# =============================================================================

# --- Movement bounds ---
# Player:  X [24, DMZ edge (X<224 at low byte, MSB=0)],
#          Y [58, 229] with upper/lower bounds enforced.
# Enemy:   X [24, 224], Y [58, 229] — clamped to safe area.
# Asteroid: despawn at Y < 10, Y > 235, or X < 8.
#          X can exceed 255 (MSB handled via $D010) for right-edge spawns.

sprites:
  - name: player
    index: 0
    x: 160
    y: 120
    color: 7               # yellow
    enabled: true
    multicolor: false
    data_file: "assets/sprites/ship_r.spr"
    data_files:
      right: "assets/sprites/ship_r.spr"
      left:  "assets/sprites/ship_l.spr"
      up:    "assets/sprites/ship_u.spr"
      down:  "assets/sprites/ship_d.spr"

  - name: enemy
    index: 1
    x: 100
    y: 80
    color: 2               # red
    enabled: true
    multicolor: false
    data_file: "assets/sprites/skull.spr"
