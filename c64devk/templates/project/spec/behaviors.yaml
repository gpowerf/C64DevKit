# Behavior definitions
# Actions are compiled to 6502 assembly by the behavior DSL compiler.
# Supported actions: read_joystick, update_sprite, set_sprite_pos,
#                    inc_score, play_sound, check_collision

behaviors:
  - name: move_player
    type: on_frame
    actions:
      - update_sprite: player

  - name: reset_on_collision
    type: on_collision
    sprites: [player, enemy]
    actions:
      - set_sprite_pos:
          sprite: player
          x: 160
          y: 120
      - inc_score: 10
