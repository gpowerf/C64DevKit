# Test definitions
# Note: this game is fully hand-coded in routines/game_logic.acme.
# The behavior DSL path is not used. Static tests verify the build structure.
# Runtime assertions require live VICE testing (display needed).

tests:
  - name: build_succeeds
    steps:
      - advance: 2
      - check: {what: sprite_x, index: 0, eq: 160}
      - check: {what: sprite_y, index: 0, eq: 120}

  - name: enemy_present
    steps:
      - advance: 2
      - check: {what: sprite_x, index: 1, eq: 100}
      - check: {what: sprite_y, index: 1, eq: 80}
